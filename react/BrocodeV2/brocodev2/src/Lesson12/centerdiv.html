<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    .div {
      width: 1000px;
      height: 1000px;
      background-color: green;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dive {
      width: 100px;
      position: relative;
      height: 100px;
      background-color: rgb(172, 223, 172);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .diveee {
      height: 10px;
      width: 10px;
      position: absolute;
      background-color: red;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
  <body>
    <div class="div">
      <div class="dive">
        <div class="diveee"></div>
      </div>
    </div>
  </body>
</html>
